name: Touch Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - name: Touch Supabase with a harmless read
        run: |
          node <<'NODE'
          const configUrl = new URL("https://justchurch.net/scheduler/src/config.js");
          configUrl.searchParams.set("workflow", Date.now().toString());

          const configResponse = await fetch(configUrl, {
            cache: "no-store",
            headers: {
              Accept: "application/javascript",
              "User-Agent": "justchurch-scheduler-supabase-touch/1.0",
            },
          });
          const configText = await configResponse.text();

          console.log(
            `Scheduler config: HTTP ${configResponse.status}; ${configResponse.headers.get("content-type") || "unknown content type"}; ${configText.length} bytes`,
          );

          if (!configResponse.ok) {
            throw new Error(`Could not fetch scheduler config: HTTP ${configResponse.status}`);
          }

          const supabaseUrl = configText.match(
            /(?:^|[{,]\s*)["']?url["']?\s*:\s*["']([^"']+)["']/m,
          )?.[1];
          const anonKey = configText.match(
            /(?:^|[{,]\s*)["']?anonKey["']?\s*:\s*["']([^"']+)["']/m,
          )?.[1];

          if (!supabaseUrl || !anonKey) {
            throw new Error(
              "Could not read Supabase URL or anon key from scheduler config.",
            );
          }

          const touchUrl = `${supabaseUrl}/rest/v1/volunteers?select=id&limit=1`;
          const response = await fetch(touchUrl, {
            headers: {
              apikey: anonKey,
              Authorization: `Bearer ${anonKey}`,
            },
          });

          const body = await response.text();
          console.log(`Supabase touch status: HTTP ${response.status}`);
          console.log(`Response: ${body.slice(0, 500)}`);

          if (!response.ok) {
            throw new Error("Supabase touch failed.");
          }
          NODE
